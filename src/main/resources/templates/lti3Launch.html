<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Terracotta</title>
</head>
<body>
<!--
  Delivers the one-time launch token (and, for instructor-or-higher launches, the LMS API OAuth
  URL) via the response body instead of a redirect query string - see Lti3Controller#home for why.
  sessionStorage is per-tab and never sent on subsequent requests (unlike a cookie or URL param),
  so it doesn't reintroduce the header-size or URL/access-log exposure problem this replaces.
-->
<p id="authorized" hidden>Terracotta is authorized. You can close this window and return to your course.</p>
<script th:inline="javascript">
    /*<![CDATA[*/
    // returning from LMS authorization in the window the Terracotta frame opened: the frame is
    // already waiting for the new token, so just close. Without an opener (a plain new tab, or the
    // LMS cut the link) fall through and open Terracotta here, as a launch would.
    if (/*[[${authorizationWindow}]]*/ false && window.opener) {
        document.getElementById("authorized").hidden = false;
        window.close();
    } else {
        sessionStorage.setItem("ltiToken", /*[[${token}]]*/ "");

        var lmsApiOAuthUrl = /*[[${lmsApiOAuthUrl}]]*/ null;

        if (lmsApiOAuthUrl) {
            sessionStorage.setItem("lmsApiOAuthUrl", lmsApiOAuthUrl);
        }

        window.location.replace("/app/app.html");
    }
    /*]]>*/
</script>
</body>
</html>
