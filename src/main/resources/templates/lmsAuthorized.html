<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Terracotta is authorized</title>
    <style>
        body {
            margin: 0;
            padding: 48px 24px;
            background: #fdf5f2;
            color: rgba(35, 48, 80, 0.87);
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 24px;
            text-align: center;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            line-height: 32px;
            font-weight: 400;
        }
    </style>
</head>
<body>
<!--
  Shown in the popup or tab the Terracotta frame opened for LMS authorization. The frame is
  polling for the token just saved and continues by itself, so this window only needs to go away.
  A popup can close itself; a tab opened from a link (or by right click) can't, so say so.
-->
<h1>Terracotta is authorized</h1>
<p>You can close this tab and return to your course.</p>
<script>
    if (window.opener) {
        window.close();
    }
</script>
</body>
</html>
